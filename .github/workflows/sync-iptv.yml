name: Sincronizar IPTV Automaticamente

on:
  # Define horários automáticos para rodar (ex: todo dia às 06:00 e às 18:00 no horário UTC)
  schedule:
    - cron: '0 6,18 * * *'
  
  # Permite que você clique em um botão na aba "Actions" do GitHub para rodar manualmente quando quiser
  workflow_dispatch:

jobs:
  atualizar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de conversão
        run: python teste_conexao.py

      - name: Enviar dados atualizados de volta para o repositório
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add data.js index.html teste_lista.m3u || true
          git diff --cached --quiet || (git commit -m "Auto-update: Atualização automática da grade de canais" && git push)
