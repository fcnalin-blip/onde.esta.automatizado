name: Atualizar Catalogo IPTV

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Testar acesso à lista
        run: |
          curl -v -L "http://hightechtvr1.online/get.php?username=97533635&password=57989443&type=m3u_plus&output=ts" \
            -H "User-Agent: Mozilla/5.0" \
            -H "Accept: */*" \
            -o lista-teste.m3u

          echo "Tamanho da lista:"
          wc -c lista-teste.m3u

      - name: Rodar o conversor
        run: python conversor.py

      - name: Enviar o data.js para o repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica do catalogo" && git push)
