name: Atualizar Catalogo IPTV

on:
  schedule:
    # Roda automaticamente todo dia às 04:00 da manhã (horário de Brasília)
    - cron: '0 7 * * *' 
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o bot salvar o data.js no seu repo
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar o conversor
        run: python conversor.py

      - name: Enviar o data.js para o repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.js
          # Verifica se houve mudança para não criar commits inúteis
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica do catalogo" && git push)
