name: Atualizar catalogo

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 9h UTC (6h em Brasília)
  workflow_dispatch:       # permite rodar manualmente pelo botão

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar data.js
        run: python conversor.py

      - name: Salvar no repositório
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Atualização automática" && git push)
