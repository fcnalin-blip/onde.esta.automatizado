name: Teste API
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          H="http://hightech.webplayer.one"
          echo "== pagina inicial =="
          curl -s -o /tmp/a.txt -m 30 -A "Mozilla/5.0" -w "HTTP %{http_code} bytes %{size_download} tipo %{content_type}\n" "$H/" || true
          echo "== bootstrap (sem login) =="
          curl -s -o /tmp/b.txt -m 30 -A "Mozilla/5.0" -w "HTTP %{http_code} bytes %{size_download} tipo %{content_type}\n" "$H/api/v1/bootstrap" || true
          head -c 200 /tmp/b.txt; echo
